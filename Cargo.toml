[package]
name = "ttype-cli"
version = "0.1.1"
edition = "2021"
authors = ["laguser <laguser@users.noreply.github.com>"]
description = "Minimalist terminal typing speed test in Rust. Smooth conveyor tape, procedural mechanical typewriter sounds, and clean transparent UI."
license = "MIT"
repository = "https://github.com/laguser/ttype"
homepage = "https://github.com/laguser/ttype"
readme = "README.md"
keywords = ["typing-test", "terminal", "tui", "typewriter", "cli"]
categories = ["command-line-utilities", "games"]

[[bin]]
name = "ttype"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
rodio = { version = "0.19", default-features = false, features = ["symphonia-wav"] }
ureq = { version = "2.10", default-features = false, features = ["tls"] }
